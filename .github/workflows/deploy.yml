name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 題庫驗證（重複 ID、答案、解析、課綱代碼、講義段落、相似度、已釋出 ID）
        run: npm run validate:content
      - name: Unit tests（含課綱、題庫、講義結構、資料 migration）
        run: npm run test
      - name: 程式題與講義範例實際執行驗證（Pyodide）
        run: npm run verify:python -- --strict
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 程式題交叉驗證（CPython）
        run: |
          pip install numpy pandas scikit-learn
          npm run verify:python -- --strict --engine=cpython
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests（GitHub Pages 子路徑建置，手機 390px／桌面 1440px）
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build（base 由 GITHUB_REPOSITORY 自動推導為 /<repo>/）
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

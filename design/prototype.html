herolabel{font-size:12px;font-weight:750;color:#cfd5ff}.dashboardgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:21px}.stack{display:grid;gap:20px}.card{border:1px solid var(--border);background:var(--surface);padding:23px;border-radius:18px;box-shadow:var(--shadow)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:21px}.cardhead h3{margin:0;font-size:16px}.cardhead .hint{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:20px 0}.stat{border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--surface)}.stat .statlabel{color:var(--muted);font-size:12px}.stat .statvalue{font-size:29px;font-weight:850;margin-top:4px;letter-spacing:-1px}.stat .smallnote{font-size:11px;color:var(--muted)}.unitrow{display:flex;gap:14px;align-items:center;margin:18px 0}.uniticon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--primary);font-size:15px;font-weight:800;flex-shrink:0}.unitinfo{flex:1;min-width:0}.unitinfo strong{font-size:14px}.unitinfo .desc{font-size:12px;color:var(--muted)}.bar{height:8px;border-radius:20px;background:#ecedf3;overflow:hidden;margin-top:8px}.bar>span{height:100%;background:var(--primary);display:block;border-radius:20px}.percent{font-size:12px;font-weight:800;color:var(--primary)}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.task .bubble{border-radius:11px;width:36px;height:36px;background:var(--soft);display:grid;place-items:center}.task strong{font-size:13px}.task p{font-size:12px;color:var(--muted);margin:1px 0}.pill{display:inline-flex;align-items:center;border-radius:100px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:750;padding:5px 10px}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.blue{background:var(--primarySoft);color:var(--primary)}.pill.red{background:var(--redSoft);color:var(--red)}.link{background:none;border:none;color:var(--primary);font-size:13px;font-weight:800;padding:0}.coursecols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.topiclist{display:grid;gap:8px}.topicbutton{width:100%;background:transparent;border:1px solid transparent;text-align:left;border-radius:12px;padding:13px;display:flex;gap:11px;align-items:center}.topicbutton.active{background:var(--primarySoft);border-color:#dce0ff}.topicbutton .topiccode{font-weight:800;font-size:12px;color:var(--primary);min-width:37px}.topicbutton .topicname{font-size:13px;font-weight:700}.topicbutton .topicmeta{font-size:11px;color:var(--muted)}.readable{max-width:760px;line-height:1.9}.readable h2{margin:12px 0;color:var(--ink);font-size:23px}.readable h3{font-size:16px;margin-top:24px}.readable p{color:#455168}.readable ul{padding-left:22px;color:#455168}.readingbox{background:var(--soft);border-radius:14px;padding:17px 20px;margin:19px 0}.readingbox strong{color:var(--primary)}.readable hr{border:0;border-top:1px solid var(--border);margin:25px 0}.questionbox{margin:16px 0}.opt{display:flex;align-items:flex-start;gap:13px;padding:14px;border:1.5px solid var(--border);border-radius:12px;margin-top:10px;cursor:pointer;transition:.1s}.opt:has(input:checked){background:var(--primarySoft);border-color:var(--primary)}.opt input{margin-top:4px;accent-color:var(--primary)}.quizmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.quizcontrols{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}.reviewbox{background:#f8fafb;border:1px solid var(--border);border-radius:13px;margin-top:18px;padding:15px 17px}.reviewbox p{margin:8px 0;color:#465167;font-size:13px}.answerline{margin:6px 0;border-left:3px solid var(--border);padding:4px 9px;color:#566073}.answerline.correct{border-color:var(--green)}.answerline.wrong{border-color:var(--red)}.dataempty{text-align:center;padding:45px 12px;color:var(--muted)}.emptyicon{font-size:32px;margin-bottom:9px}.assessment{margin:12px 0;border:1px solid var(--border);border-radius:13px;padding:15px}.assessment h4{margin:0 0 8px}.history{border-top:1px solid var(--border);padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.history:first-child{border-top:none}.history strong{display:block;font-size:13px}.history small{color:var(--muted)}select,input[type=date],input[type=number]{padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:white;max-width:100%;color:var(--ink)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hintline{font-size:12px;color:var(--muted);margin-top:13px}.announcement{background:#fff9ec;border:1px solid #faebc8;border-radius:12px;padding:12px 15px;font-size:12px;color:#7c5b23}.mobilehead,.bottomnav{display:none}.desktop-only{display:block}.mobile-only{display:none}

@media(max-width:620px){.content{padding:22px 16px 110px}.topbar{padding:0 16px}.switch button{padding:7px 10px;font-size:12px}.profile{display:none}.pagehead h1{font-size:26px}.pagehead{align-items:start;flex-direction:column;margin-bottom:18px}.hero{padding:27px 22px;border-radius:17px}.hero h2{font-size:21px}.hero p{font-size:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats .stat:nth-child(3){grid-column:span 2}.stat{padding:15px}.stat .statvalue{font-size:25px}.card{padding:18px;border-radius:16px}.twocol{grid-template-columns:1fr}.quizcontrols .btn{flex:1}.pagehead .btn{width:100%}.mobilehead{font-size:16px}}

<aside class="sidebar"><div class="brand"><div class="logo">✦</div><div><div class="brandname">AI 備考室</div><div class="brandsub">iPAS AI 學習平台</div></div></div><div class="menu-caption">學習空間</div><div id="desktopNav"></div><div class="sidebarfoot"><strong>自主備考・隨時開啟</strong><p>示範版為自編練習題與部分講義。資料僅儲存在目前裝置，並非官方網站。</p></div></aside>

<script>
'use strict';
const navs=[['home','⌂','首頁'],['courses','▤','講義'],['quiz','✎','練題'],['wrong','◇','錯題'],['stats','▥','成績'],['settings','⚙','設定']];
const units=[
 ['L111','人工智慧概念','L11','junior'],['L112','資料處理與分析概念','L11','junior'],['L113','機器學習概念','L11','junior'],['L114','鑑別式與生成式 AI','L11','junior'],['L121','No Code / Low Code','L12','junior'],['L122','生成式 AI 工具應用','L12','junior'],['L123','生成式 AI 導入規劃','L12','junior'],
 ['L211','AI 相關技術應用','L21','middle'],['L212','AI 導入評估規劃','L21','middle'],['L213','AI 系統部署','L21','middle'],['L221','機率統計基礎','L22','middle'],['L222','大數據處理技術','L22','middle'],['L223','大數據分析方法','L22','middle'],['L224','大數據與 AI 應用','L22','middle'],['L231','機器學習基礎數學','L23','middle'],['L232','機器學習與深度學習','L23','middle'],['L233','建模與參數調校','L23','middle'],['L234','機器學習治理','L23','middle']
];
const lessons={
 L111:{title:'人工智慧概念',codes:['L11101 AI 的定義與分類','L11102 AI 治理概念'],body:`<h3>1. 什麼是人工智慧？</h3><p>人工智慧（Artificial Intelligence, AI）是讓電腦系統完成通常需要人類智能參與的任務，例如辨識圖片、理解語言、推理或決策。AI 不必具有自我意識，也不局限於人形機器人。</p><div class="readingbox"><strong>必記考點｜AI ≠ 機器人</strong><p>「AI」是能力與技術領域，「機器人」是可與物理環境互動的機械或電子系統。機器人可以沒有 AI，AI 也可以只是一套軟體。</p></div><h3>2. AI 的常見分類</h3><p>依能力可概略區分特定任務型人工智慧（狹義 AI）與通用人工智慧（AGI，現階段仍屬研究目標）。依實作方式又可討論規則式系統、機器學習與深度學習；它們是不同分類角度，不要混為一談。</p><h3>3. AI 治理與負責任 AI</h3><p>AI 治理是針對 AI 的設計、開發與使用設定政策、責任、風險管理與監督機制。重要原則包含透明度、公平性、資料隱私、安全性、可問責性與人類監督。</p><div class="readingbox"><strong>考題陷阱</strong><p>「模型準確率很高，所以完全不需要人工監督」是錯誤推論。模型即使表現不錯，仍可能遇到偏誤、資料分布改變或高風險情境。</p></div><h3>4. 生活例子</h3><p>工廠運用影像辨識找出瑕疵，是 AI 的感知任務；企業導入履歷篩選 AI 時，應檢查是否對特定群體造成不合理差異並建立人工申訴管道，則是 AI 治理的應用。</p>`},
 L112:{title:'資料處理與分析概念',codes:['L11201 資料基本概念與來源','L11202 資料整理與分析流程','L11203 資料隱私與安全'],body:`<h3>1. 結構化與非結構化資料</h3><p>結構化資料多以固定欄位與表格呈現，例如商品庫存；非結構化資料包括文章、聲音與圖片。不同型態需要不同的整理及處理方式。</p><h3>2. 資料分析流程</h3><p>常見順序為定義問題 → 蒐集資料 → 清理與整合 → 探索與分析 → 建模或解釋 → 呈現成果。資料缺失值、重複值與異常值都應在前處理階段留意。</p><div class="readingbox"><strong>重要辨析</strong><p>資料標準化與正規化都是常見特徵尺度處理方式，但計算方法不同。不能說「所有資料進 AI 前都一定要做完全相同的標準化」。</p></div><h3>3. 隱私與安全</h3><p>資料最小化、權限控管、加密與風險評估都與個資保護相關。匿名化與假名化不是同一回事，仍應檢視識別風險。</p>`}
};
const questions=[
 {id:'demo-01',unit:'L111',code:'L11101',stem:'下列哪一項最符合「人工智慧」的描述？',opt:['只有裝在人形機器人上的軟體才算 AI','讓系統執行辨識、推理或決策等智能相關任務的技術','任何需要連網的電腦程式都屬於 AI','所有 AI 都具有人類等級的自我意識'],ans:1,why:['AI 可以只是純軟體，不需要實體機器人。','正確：AI 著重於讓電腦完成智能相關任務。','連網與否並不是判定 AI 的標準。','現有 AI 不必具有自我意識。'],note:'AI 的定義著重任務與能力，並非外觀或意識。'},
 {id:'demo-02',unit:'L111',code:'L11102',stem:'企業導入履歷篩選 AI，以下哪項最符合負責任 AI 的治理精神？',opt:['只看模型速度，忽略其他影響','因為 AI 能自動評分，就完全取消申訴機制','評估資料偏誤、建立人工覆核與申訴流程','把所有應徵者資料公開以展示透明度'],ans:2,why:['速度不是唯一評估標準，還需要考量公平、隱私與風險。','自動化不等於不需要監督與申訴。','正確：兼顧公平性、問責與人類監督。','透明度不等於公開個資，反而可能違反隱私保護。'],note:'AI 治理重點：公平性、可問責性、隱私與監督。'},
 {id:'demo-03',unit:'L111',code:'L11101',stem:'下列何者最能說明 AI 與機器人的關係？',opt:['所有機器人都一定採用 AI','AI 一定要搭配實體機器人才能運作','AI 與機器人完全同義','機器人可以不使用 AI，AI 也可以不包含機器人'],ans:3,why:['傳統固定流程的機器人可不使用 AI。','文字生成與推薦系統等 AI 都可以沒有實體機器人。','兩者概念不同，不能畫等號。','正確：技術領域與實體系統是不同層次。'],note:'考試常透過「一定」「所有」「只能」等絕對語句製造陷阱。'},
 {id:'demo-04',unit:'L112',code:'L11201',stem:'下列何者是最典型的結構化資料？',opt:['依固定欄位整理的銷售訂單表','一段沒有欄位結構的錄音','未標註的原始照片','一篇自由格式的長篇文章'],ans:0,why:['正確：訂單表的欄位固定、便於查詢與分析。','音檔通常不具固定表格欄位結構。','原始照片屬常見非結構化資料。','自由文字通常屬非結構化資料。'],note:'資料型態與資料來源是資料前處理的基礎。'},
 {id:'demo-05',unit:'L112',code:'L11202',stem:'資料分析過程中，發現同一筆訂單重複匯入。通常最先應在哪個步驟處理？',opt:['資料視覺化配色','模型正式上線後才處理','資料清理與前處理','報告列印'],ans:2,why:['改顏色不能修正資料重複。','資料品質問題應盡量在建模前處理。','正確：去重是典型的資料清理任務。','列印報告不是資料品質修正步驟。'],note:'資料清理不只是處理遺失值，也包含重複、異常與格式問題。'}
];
const STORE='ipas-ai-prep-demo-v1';
function initial(){return {level:'junior',page:'home',unit:'L111',completed:[],attempts:[],sessions:[],track:'data',weekly:5,minutes:75,activeQuiz:null};}
let state;try{state={...initial(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{state=initial()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nameOf(code){return units.find(u=>u[0]===code)?.[1]||code}
function currentUnits(){return units.filter(x=>x[3]===state.level)}
function go(page){state.page=page;save();render();window.scrollTo(0,0)}
function setLevel(level){state.level=level;state.unit=level==='junior'?'L111':'L211';state.activeQuiz=null;state.page='home';save();render()}
function setUnit(code){state.unit=code;state.page='courses';save();render();window.scrollTo(0,0)}
function completeUnit(){if(!state.completed.includes(state.unit))state.completed.push(state.unit);save();render()}
function progressFor(subject){let subset=currentUnits().filter(u=>u[2]===subject);let count=subset.filter(u=>state.completed.includes(u[0])).length;return {count,total:subset.length,pct:subset.length?Math.round(count/subset.length*100):0}}
function resultStats(){let a=state.attempts.filter(a=>questions.find(q=>q.id===a.id && units.find(u=>u[0]===q.unit)[3]===state.level));return {count:a.length,correct:a.filter(v=>v.correct).length,pct:a.length?Math.round(a.filter(v=>v.correct).length/a.length*100):0}}
function wrongIds(){let wrong=new Set();for(let a of state.attempts){if(!a.correct)wrong.add(a.id)}return [...wrong].filter(id=>questions.some(q=>q.id===id && units.find(u=>u[0]===q.unit)[3]===state.level))}
function reviewRecent(){return [...state.sessions].reverse().filter(s=>s.level===state.level)}
function subjects(){return state.level==='junior'?['L11','L12']:['L21','L22','L23']}
function switchUI(){document.querySelector('#juniorBtn').className=state.level==='junior'?'on':'';document.querySelector('#middleBtn').className=state.level==='middle'?'on':''}
function renderNav(){document.querySelector('#desktopNav').innerHTML=navs.map(n=>`<button class="nav ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="symbol">${n[1]}</span><span>${n[2]}</span></button>`).join('');document.querySelector('#mobileNav').innerHTML=navs.filter(n=>n[0]!=='settings').map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="symbol">${n[1]}</span>${n[2]}</button>`).join('')}
function heading(k,h,p,button=''){return `<div class="pagehead"><div><div class="kicker">${k}</div><h1>${h}</h1><p>${p}</p></div>${button}</div>`}
function renderHome(){let ls=currentUnits(),done=ls.filter(u=>state.completed.includes(u[0])).length,rs=resultStats(),wrong=wrongIds().length,first=ls.find(u=>!state.completed.includes(u[0]))||ls[0];let cards=subjects().map(s=>{let p=progressFor(s);return `<div class="unitrow"><div class="uniticon">${s}</div><div class="unitinfo"><strong>${s==='L11'?'人工智慧基礎概論':s==='L12'?'生成式 AI 應用與規劃':s==='L21'?'AI 技術應用與規劃':s==='L22'?'大數據處理分析': '機器學習技術與應用'}</strong><div class="bar"><span style="width:${p.pct}%"></span></div></div><span class="percent">${p.pct}%</span></div>`}).join('');let recent=reviewRecent().slice(0,3);return `${heading('LEARNING DASHBOARD',`準備好，繼續朝考照目標前進。`,'依官方評鑑範圍建立課程架構；目前為互動示範版。')}<div class="dashboardgrid"><div class="stack"><section class="hero"><div class="herolabel">你的學習目標 · ${state.level==='junior'?'2027 年初｜初級':'2027 年中｜中級'}</div><h2>${state.level==='junior'?'從基本觀念開始，穩穩完成初級備考。':'開始規劃你的中級技術路線。'}</h2><p>先讀講義，再做單元測驗；錯題會保留，下一次回來可以接著複習。</p><button class="btn" onclick="setUnit('${first[0]}')">繼續學習 ${first[0]}　→</button></section><div class="stats"><div class="stat"><div class="statlabel">已完成單元</div><div class="statvalue">${done}<span style="font-size:14px;color:var(--muted)">/${ls.length}</span></div><div class="smallnote">依 L 主題計算</div></div><div class="stat"><div class="statlabel">累計作答題數</div><div class="statvalue">${rs.count}</div><div class="smallnote">示範題庫作答</div></div><div class="stat"><div class="statlabel">累計正確率</div><div class="statvalue">${rs.count?rs.pct+'%':'—'}</div><div class="smallnote">依已作答紀錄</div></div></div><section class="card"><div class="cardhead"><h3>課程進度</h3><button class="link" onclick="go('courses')">查看所有課程 →</button></div>${cards}</section></div><div class="stack"><section class="card"><div class="cardhead"><h3>今天可以做什麼？</h3><span class="pill blue">自主學習</span></div><div class="task"><div class="bubble">📖</div><div style="flex:1"><strong>閱讀下一個單元</strong><p>${first[0]} ${first[1]}</p></div><button class="link" onclick="setUnit('${first[0]}')">前往</button></div><div class="task"><div class="bubble">✎</div><div style="flex:1"><strong>單元測驗</strong><p>用自編題確認觀念</p></div><button class="link" onclick="go('quiz')">前往</button></div><div class="task"><div class="bubble">↻</div><div style="flex:1"><strong>錯題補強</strong><p>${wrong} 題曾經答錯</p></div><button class="link" onclick="go('wrong')">前往</button></div></section><section class="card"><div class="cardhead"><h3>最近測驗</h3><button class="link" onclick="go('stats')">查看成績 →</button></div>${recent.length?recent.map(s=>`<div class="history"><div><strong>${esc(nameOf(s.unit))}</strong><small>${new Date(s.at).toLocaleString('zh-TW')}</small></div><span class="pill ${s.pct>=80?'green':'red'}">${s.pct}%</span></div>`).join(''):'<div class="dataempty">完成第一次測驗後，就會看到成績紀錄。</div>'}</section><div class="announcement">此為非官方互動原型。已收錄少量自編示範題；完整講義、官方授權題庫與跨裝置同步需後續開發。</div></div></div>`}
function renderCourses(){if(!currentUnits().some(u=>u[0]===state.unit))state.unit=currentUnits()[0][0];let lesson=lessons[state.unit],isDone=state.completed.includes(state.unit),unit=currentUnits().find(u=>u[0]===state.unit);return `${heading('COURSES', '講義中心','依官方 L 代碼安排課程，從概念理解走向考題實作。')}<div class="coursecols"><section class="card"><div class="cardhead"><h3>${state.level==='junior'?'初級課綱':'中級課綱'}</h3></div><div class="topiclist">${currentUnits().map(u=>`<button class="topicbutton ${state.unit===u[0]?'active':''}" onclick="setUnit('${u[0]}')"><span class="topiccode">${u[0]}</span><span><div class="topicname">${esc(u[1])}</div><div class="topicmeta">${state.completed.includes(u[0])?'✓ 已讀完成':'待閱讀'} · ${u[2]}</div></span></button>`).join('')}</div></section><article class="card readable"><span class="pill blue">${unit[2]} · ${state.unit}</span><h2>${esc(unit[1])}</h2><p style="font-size:12px;color:var(--muted)">依 115.06 版官方評鑑範圍對應。以下自編講義內容僅作示範。</p>${lesson?`<div class="readingbox"><strong>本單元官方細項</strong><ul>${lesson.codes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>${lesson.body}<hr><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ${isDone?'secondary':''}" onclick="completeUnit()">${isDone?'✓ 已標記完成':'✓ 標記已閱讀'}</button><button class="btn ghost" onclick="beginQuiz('${state.unit}')">開始單元小測驗　→</button></div>`:`<div class="dataempty"><div class="emptyicon">▤</div><h3>完整講義待建置</h3><p>課綱主題已列出。請 Claude Code 根據官方學習指引新增正確內容、例子與對應試題。</p><a href="https://ipd.nat.gov.tw/ipas/certification/AIAP/learning-resources" target="_blank" rel="noopener">開啟官方學習資源 ↗</a></div>`}</article></div>`}
function beginQuiz(unit){let qs=questions.filter(q=>q.unit===unit);if(!qs.length){alert('這個單元尚未收錄示範題。完整題庫需後續擴充。');return}state.activeQuiz={unit,ids:qs.map(q=>q.id),answers:{},started:Date.now()};state.page='quiz';save();render();window.scrollTo(0,0)}
function setAnswer(id,index){if(!state.activeQuiz)return;state.activeQuiz.answers[id]=index;save();render()}
function quitQuiz(){if(confirm('確定要離開這次測驗？作答紀錄將保留，仍可回來繼續。')){state.page='home';save();render()}}
function submitQuiz(){let q=state.activeQuiz;if(!q)return;let unanswered=q.ids.filter(id=>q.answers[id]===undefined);if(unanswered.length && !confirm(`還有 ${unanswered.length} 題未作答，確定交卷嗎？`))return;let correct=0;const at=new Date().toISOString();for(let id of q.ids){let item=questions.find(x=>x.id===id),selected=q.answers[id]??-1,ok=item.ans===selected;if(ok)correct++;state.attempts.push({id,selected,correct:ok,at})}let pct=Math.round(correct/q.ids.length*100);state.sessions.push({unit:q.unit,level:state.level,ids:q.ids,answers:q.answers,at,pct,correct,total:q.ids.length});state.activeQuiz=null;state.page='results';save();render();window.scrollTo(0,0)}
function renderQuiz(){let quiz=state.activeQuiz;if(!quiz){return `${heading('PRACTICE','單元測驗','選擇目前已收錄的題庫單元來進行練習。')}<section class="card"><div class="cardhead"><h3>選擇練習主題</h3><span class="pill">均為自編示範題</span></div>${currentUnits().map(u=>{let count=questions.filter(q=>q.unit===u[0]).length;return `<div class="history"><div><strong>${u[0]} ${esc(u[1])}</strong><small>${count?`已收錄 ${count} 題示範題`:'尚未收錄題目'}</small></div><button class="btn small ${count?'':'secondary'}" ${count?'':'disabled'} onclick="beginQuiz('${u[0]}')">${count?'開始練習':'待建置'}</button></div>`}).join('')}</section>`}let qs=quiz.ids.map(id=>questions.find(q=>q.id===id));let answered=quiz.ids.filter(id=>quiz.answers[id]!==undefined).length;return `${heading('PRACTICE',`${quiz.unit} 單元測驗`,'交卷後會顯示答案與所有選項的詳細解析。',`<button class="btn secondary small" onclick="quitQuiz()">暫時離開</button>`)}<div class="quizmeta"><span class="pill blue">自編示範題</span><span class="pill">${qs.length} 題單選題</span><span class="pill">已作答 ${answered}/${qs.length}</span></div><section class="card"><div class="bar" style="margin-bottom:18px"><span style="width:${answered/qs.length*100}%"></span></div>${qs.map((q,n)=>`<div class="questionbox"><span class="pill">第 ${n+1} 題 · ${q.code}</span><h3 style="font-size:17px;line-height:1.65;margin:13px 0">${esc(q.stem)}</h3>${q.opt.map((t,i)=>`<label class="opt"><input type="radio" name="${q.id}" ${quiz.answers[q.id]===i?'checked':''} onchange="setAnswer('${q.id}',${i})"><span><strong>${'ABCD'[i]}.</strong> ${esc(t)}</span></label>`).join('')}</div>${n<qs.length-1?'<hr style="border:0;border-top:1px solid var(--border);margin:25px 0">':''}`).join('')}<div class="quizcontrols"><span style="font-size:12px;color:var(--muted)">答錯題目將自動收錄至錯題本。</span><button class="btn" onclick="submitQuiz()">交卷並查看解析　→</button></div></section>`}
function renderResults(){let s=reviewRecent()[0];if(!s)return renderQuiz();return `${heading('YOUR RESULT','測驗已完成','每個選項都可以查看解說，並回到對應講義補強。',`<button class="btn ghost" onclick="go('wrong')">查看錯題本 →</button>`)}<div class="stats"><div class="stat"><div class="statlabel">本次成績</div><div class="statvalue">${s.pct}%</div></div><div class="stat"><div class="statlabel">答對題目</div><div class="statvalue">${s.correct}/${s.total}</div></div><div class="stat"><div class="statlabel">學習建議</div><div style="font-size:16px;font-weight:800;margin-top:8px">${s.pct>=80?'繼續下一單元':'回講義補強'}</div></div></div><div class="stack">${s.ids.map((id,n)=>{let q=questions.find(x=>x.id===id),a=s.answers[id]??-1,ok=a===q.ans;return `<section class="card"><div class="cardhead"><h3>第 ${n+1} 題 · ${q.code}</h3><span class="pill ${ok?'green':'red'}">${ok?'✓ 答對':'✕ 答錯'}</span></div><strong>${esc(q.stem)}</strong><p style="font-size:13px;color:var(--muted)">你的答案：${a<0?'未作答':'ABCD'[a]}　／　正確答案：${'ABCD'[q.ans]}</p><div class="reviewbox"><strong>逐一解析</strong>${q.opt.map((opt,i)=>`<div class="answerline ${i===q.ans?'correct':i===a?'wrong':''}"><strong>${'ABCD'[i]}. ${esc(opt)}</strong><p>${esc(q.why[i])}</p></div>`).join('')}<p><strong>重點提醒：</strong>${esc(q.note)}</p></div><div style="margin-top:13px"><button class="link" onclick="setUnit('${q.unit}')">回到 ${q.unit} 講義複習 →</button></div></section>`}).join('')}<div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn" onclick="beginQuiz('${s.unit}')">再做一次（示範題）</button><button class="btn secondary" onclick="go('stats')">查看所有成績</button></div></div>`}
function renderWrong(){let ids=wrongIds();let last=Object.fromEntries(ids.map(id=>[id,[...state.attempts].reverse().find(a=>a.id===id)]));return `${heading('REVIEW','錯題本','曾經答錯的題目會持續保留，方便追蹤薄弱考點。')}<section class="card"><div class="cardhead"><h3>需要回顧的考點</h3><span class="pill red">${ids.length} 題</span></div>${ids.length?ids.map(id=>{let q=questions.find(q=>q.id===id),n=state.attempts.filter(a=>a.id===id&&!a.correct).length;return `<div class="history"><div style="flex:1"><strong>${q.code}｜${esc(q.stem)}</strong><small>累計答錯 ${n} 次 · ${last[id]?.correct?'最近一次已答對，仍保留紀錄':'建議重讀'} </small></div><button class="btn small secondary" onclick="setUnit('${q.unit}')">回講義</button></div>`}).join(''):'<div class="dataempty"><div class="emptyicon">🎯</div><h3>目前沒有錯題</h3><p>完成單元測驗後，系統會自動整理答錯的題目。</p><button class="btn" onclick="go(\'quiz\')">開始練題</button></div>'}</section><p class="hintline">正式版將加入錯題重測、間隔複習（1／3／7／14 天）、依考點篩選與已掌握狀態。</p>`}
function renderStats(){let ss=reviewRecent();let rs=resultStats();return `${heading('ANALYTICS','學習成績','從測驗紀錄辨識需要加強的單元。')}<div class="stats"><div class="stat"><div class="statlabel">已完成測驗</div><div class="statvalue">${ss.length}</div></div><div class="stat"><div class="statlabel">作答次數</div><div class="statvalue">${rs.count}</div></div><div class="stat"><div class="statlabel">累計正確率</div><div class="statvalue">${rs.count?rs.pct+'%':'—'}</div></div></div><div class="twocol"><section class="card"><div class="cardhead"><h3>單元掌握情況</h3></div>${currentUnits().map(u=>{let a=state.attempts.filter(x=>questions.some(q=>q.id===x.id&&q.unit===u[0]));let p=a.length?Math.round(a.filter(v=>v.correct).length/a.length*100):0;return `<div class="unitrow"><div class="unitinfo"><strong>${u[0]} ${esc(u[1])}</strong><div class="bar"><span style="width:${p}%"></span></div></div><span class="percent">${a.length?p+'%':'—'}</span></div>`}).join('')}</section><section class="card"><div class="cardhead"><h3>歷次測驗</h3></div>${ss.length?ss.map(s=>`<div class="history"><div><strong>${s.unit} ${esc(nameOf(s.unit))}</strong><small>${new Date(s.at).toLocaleString('zh-TW')} · 答對 ${s.correct}/${s.total} 題</small></div><span class="pill ${s.pct>=80?'green':'red'}">${s.pct}%</span></div>`).join(''):'<div class="dataempty">尚無測驗紀錄</div>'}</section></div>`}
function exportData(){const blob=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI備考室_學習進度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(j.schemaVersion!==1||!j.data||!Array.isArray(j.data.attempts)||!Array.isArray(j.data.sessions)||!Array.isArray(j.data.completed))throw Error('備份格式不符');if(!confirm('確定以備份進度覆蓋這個裝置的資料嗎？'))return;state={...initial(),...j.data,activeQuiz:null,page:'home'};save();render()}catch(err){alert('匯入失敗：'+err.message)}};r.readAsText(f);e.target.value=''}
function clearData(){if(confirm('確定清空此裝置所有學習紀錄？這個操作無法復原，建議先匯出備份。')&&confirm('請再次確認：真的要清除所有學習進度？')){state=initial();save();render()}}
function setTrack(val){state.track=val;save();render()}
function renderSettings(){return `${heading('SETTINGS','偏好設定','目前的資料僅保存在這台裝置的瀏覽器。')}<div class="twocol"><section class="card"><div class="cardhead"><h3>學習計畫</h3></div><label for="trackSelect" style="display:block;margin-bottom:7px">中級目標路線</label><select id="trackSelect" onchange="setTrack(this.value)"><option value="data" ${state.track==='data'?'selected':''}>數據分析（L21＋L22）</option><option value="ml" ${state.track==='ml'?'selected':''}>機器學習（L21＋L23）</option><option value="both" ${state.track==='both'?'selected':''}>兩條路線一起準備</option></select><p class="hintline">目標時程：2027 年初初級，2027 年中中級。確切日期以官方公告為準。</p><div class="announcement" style="margin-top:20px">依 2026 官方資料設計課綱；正式上線前應再次檢查 2027 年更新版本。</div></section><section class="card"><div class="cardhead"><h3>資料備份</h3></div><p style="color:var(--muted);font-size:13px">換手機或換電腦不會自動同步進度。可先匯出 JSON，再到另一台裝置匯入。</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="exportData()">匯出學習紀錄</button><label class="btn secondary" for="uploadJSON">匯入紀錄</label><input style="display:none" type="file" id="uploadJSON" accept=".json,application/json" onchange="importData(event)"></div><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><button class="btn secondary" onclick="clearData()">清除這台裝置的紀錄</button></section></div><div class="announcement" style="margin-top:20px">這份 HTML 是可互動的介面原型，不是完整正式產品；其題目為自行編寫的示範題，不包含未經授權複製的官方歷屆試題，亦沒有串接 AI 即時問答。</div>`}
function render(){switchUI();renderNav();document.querySelector('#breadcrumb').textContent='學習總覽 / '+(navs.find(n=>n[0]===state.page)?.[2]||'測驗結果');const content={home:renderHome,courses:renderCourses,quiz:renderQuiz,results:renderResults,wrong:renderWrong,stats:renderStats,settings:renderSettings};document.querySelector('#appContent').innerHTML=(content[state.page]||renderHome)();}
render();
</script>
</body></html>
